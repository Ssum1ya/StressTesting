version: '3.8'

services:
  db:
    image: postgres:latest
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    volumes:
      - new_pgdata:/var/lib/postgresql/data
    container_name: db4
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data/new_pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command: >
      postgres
        -c max_connections=300
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=128MB
    ports:
      - "5442:5432"
    networks: [ test-net ]

  app-consumer:
    build: ./ConsumeService
    ports: ["8085:8080"]
    networks: [test-net]
    environment:
      GRPC_PROCESS_SERVICE_ADDRESS: static://app-process:9090
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '1.0'
          memory: 256M

  app-process:
    build: ./ProcessService
    ports:
      - "8086:8080"
      - "9090:9090"
    networks: [test-net]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '1.0'
          memory: 256M

volumes:
  new_pgdata:

networks:
  test-net:
    driver: bridge