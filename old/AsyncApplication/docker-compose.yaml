version: '3.8'

services:
  db:
    image: postgres:latest
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    volumes:
      - new_pgdata:/var/lib/postgresql/data
    container_name: db
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data/new_pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=128MB
    ports:
      - "5434:5432"
    networks: [ test-net ]

  app-consumer:
    build: ./ConsumeService
    ports: ["8083:8080"]
    networks: [test-net]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '2.0'
          memory: 512M

  app-process:
    build: ./ProcessService
    ports: ["8084:8080"]
    networks: [test-net]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '2.0'
          memory: 512M

volumes:
  new_pgdata:

networks:
  test-net:
    driver: bridge