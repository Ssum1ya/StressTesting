worker_processes auto;
worker_rlimit_nofile 200000;

events {
    multi_accept on;           # Принимать сразу все соединения
    use epoll;                 # Linux epoll для максимальной эффективности
    worker_connections 100000; # Увеличили под высокую нагрузку
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 75;
    keepalive_requests 2000;   # Больше запросов на соединение

    # Буферы под высокую нагрузку
    client_header_buffer_size 4k;
    large_client_header_buffers 8 8k;
    client_max_body_size 16m;
    client_body_buffer_size 128k;

    # Оптимизация хеш-таблиц
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;

    upstream consumer_backend {
        least_conn;

        server app-process-1:8083;
        server app-process-2:8084;
        server app-process-3:8086;
        server app-process-4:8088;

        keepalive 256;             # ↑ с 1000 (разумный лимит)
        keepalive_timeout 75s;     # Время жизни idle соединения
        keepalive_requests 5000;   # Запросов на keepalive соединение
    }

    server {
        listen 80 reuseport;

        location / {
            proxy_pass http://consumer_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Connection "keep-alive";

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 64 16k;
            proxy_busy_buffers_size 128k;


            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}